server {
  listen 8080; server_name _;
  root /usr/share/nginx/html; index index.html;
  server_tokens off; gzip on; gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; manifest-src 'self'; connect-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  location = /sw.js { expires -1; }
  location /assets/ { expires 1h; }
  location /assets/fonts/ { expires 30d; }
  error_page 404 /404.html;
  location / { try_files $uri $uri/ =404; }
}
